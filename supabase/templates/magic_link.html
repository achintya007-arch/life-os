<div style="background:#05060a;padding:32px 24px;font-family:'Segoe UI',Helvetica,Arial,sans-serif;color:#ece8de">
  <div style="max-width:440px;margin:0 auto">
    <div style="font-weight:700;letter-spacing:3px;font-size:15px">LIFE<span style="color:#ffb347">//</span>OS</div>
    <p style="font-size:15px;line-height:1.5;color:#9095a6;margin:24px 0 8px">Your sign-in code:</p>
    <div style="font-family:Consolas,'Courier New',monospace;font-size:34px;letter-spacing:10px;color:#ffd98a;font-weight:700;padding:14px 0">{{ .Token }}</div>
    <p style="font-size:14px;line-height:1.5;color:#9095a6;margin:8px 0 24px">Enter it in LIFE//OS to continue your character. It expires in one hour.</p>
    <p style="font-size:13px;color:#5a5f70">On this same device? You can also <a href="{{ .ConfirmationURL }}" style="color:#ffb347">tap here to sign in</a>.</p>
    <p style="font-size:12px;color:#5a5f70;margin-top:28px">Didn't ask for this? Ignore this email — nothing happens without the code.</p>
  </div>
</div>
